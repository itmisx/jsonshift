name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w ."
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 单测与可执行示例
        run: go test -coverprofile=coverage.out ./...

      - name: 并发安全
        run: go test -race ./...

      - name: 覆盖率
        run: go tool cover -func=coverage.out | tail -1

      - name: 基准（只验证能跑通）
        run: go test -bench=. -benchtime=10x -run XXX ./...
